; ===================================================================
; Screenshot Router - Configuration
; ===================================================================

[Settings]
; Base folder where Windows Snipping Tool automatically saves screenshots.
; Leave empty to default to: %USERPROFILE%\Pictures\Screenshots
ScreenshotSourceDir =

; Prefix for routed screenshots (default: snap_)
FilePrefix = snap_

; Timestamp format (AutoHotkey FormatTime syntax, default: yyyyMMdd_HHmmss)
TimestampFormat = yyyyMMdd_HHmmss

; Maximum time (in milliseconds) to wait for Windows Snipping Tool to write the file (default: 15000)
TimeoutMs = 15000

[Presets]
; Map number keys (1-9) to your frequent destination folders.
; Format: Key = Display Name | Destination Path
; Environment variables (like %USERPROFILE%) are supported.

1 = College / Lab | %USERPROFILE%\Pictures\SortedScreenshots\College
2 = Projects      | %USERPROFILE%\Pictures\SortedScreenshots\Projects
3 = UI & Refs     | %USERPROFILE%\Pictures\SortedScreenshots\References
